global:
  resolve_timeout: 5m
route:
  receiver: task-operations
  group_by: [alertname, service, severity]
  group_wait: 15s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: task-operations
    webhook_configs:
      - url: http://alert-router:8080/alerts
        send_resolved: true
