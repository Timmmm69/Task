groups:
  - name: task-core-availability
    rules:
      - alert: TaskApiUnavailable
        expr: probe_success{job="task-api-readiness"} == 0
        for: 2m
        labels: {severity: critical, service: api, owner: operations}
        annotations: {summary: Task API is unavailable or not ready, description: The internal readiness probe has failed for two minutes., runbook: OPS-04#api-or-database-unavailable}
      - alert: TaskApiServerErrors
        expr: sum(rate(task_api_http_requests_total{status_class="5xx"}[5m])) > 0.1
        for: 5m
        labels: {severity: warning, service: api, owner: operations}
        annotations: {summary: Task API server error rate is elevated, description: The API has sustained more than 0.1 server errors per second., runbook: OPS-04#api-server-errors}
      - alert: TaskDatabaseUnavailable
        expr: pg_up{job="postgres"} == 0
        for: 2m
        labels: {severity: critical, service: database, owner: operations}
        annotations: {summary: Task PostgreSQL is unavailable to monitoring, description: The least-privilege PostgreSQL exporter cannot complete a scrape., runbook: OPS-04#api-or-database-unavailable}
      - alert: TaskDatabaseConnectionsHigh
        expr: sum(pg_stat_activity_count{job="postgres"}) / max(pg_settings_max_connections{job="postgres"}) > 0.8
        for: 10m
        labels: {severity: warning, service: database, owner: operations}
        annotations: {summary: PostgreSQL connection capacity exceeds 80 percent, description: Sustained connection pressure can reject API and worker traffic., runbook: OPS-04#capacity}
  - name: task-host-and-workers
    rules:
      - alert: TaskHostDiskSpaceLow
        expr: node_filesystem_avail_bytes{job="task-host",fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{job="task-host",fstype!~"tmpfs|overlay|squashfs"} < 0.15
        for: 15m
        labels: {severity: warning, service: host, owner: operations}
        annotations: {summary: Task host filesystem has less than 15 percent free, description: Free capacity is below the warning threshold., runbook: OPS-04#capacity}
      - alert: TaskHostDiskSpaceCritical
        expr: node_filesystem_avail_bytes{job="task-host",fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{job="task-host",fstype!~"tmpfs|overlay|squashfs"} < 0.05
        for: 5m
        labels: {severity: critical, service: host, owner: operations}
        annotations: {summary: Task host filesystem has less than 5 percent free, description: Service continuity and WAL archival are at immediate risk., runbook: OPS-04#capacity}
      - alert: TaskWorkerMetricsMissing
        expr: absent(task_worker_metrics_generated_unixtime_seconds{job="task-worker"})
        for: 1m
        labels: {severity: critical, service: worker, owner: operations}
        annotations: {summary: Task worker metrics are missing, description: The worker process or its protected textfile publication path is unavailable., runbook: OPS-04#worker-failure}
      - alert: TaskWorkerMetricsStale
        expr: time() - task_worker_metrics_generated_unixtime_seconds{job="task-worker"} > 60
        for: 1m
        labels: {severity: critical, service: worker, owner: operations}
        annotations: {summary: Task worker metrics are stale, description: No fresh worker snapshot has been published for more than one minute., runbook: OPS-04#worker-failure}
      - alert: TaskWorkerPassStale
        expr: task_worker_configured{job="task-worker"} == 0 or time() - task_worker_last_success_unixtime_seconds{job="task-worker"} > task_worker_max_silence_seconds{job="task-worker"}
        for: 1m
        labels: {severity: critical, service: worker, owner: operations}
        annotations: {summary: A Task background worker has stopped completing passes, description: The worker label identifies the stalled loop., runbook: OPS-04#worker-failure}
      - alert: TaskWorkerFailures
        expr: increase(task_worker_failures_total{job="task-worker"}[10m]) > 0
        for: 1m
        labels: {severity: warning, service: worker, owner: operations}
        annotations: {summary: Task background delivery or maintenance failures detected, description: One or more worker operations failed during the last ten minutes., runbook: OPS-04#worker-failure}
  - name: task-backup-protection
    rules:
      - alert: TaskBackupMetricsMissing
        expr: absent(task_backup_metrics_generated_unixtime_seconds{job="task-backup"})
        for: 2m
        labels: {severity: critical, service: backup, owner: operations}
        annotations: {summary: Task backup protection metrics are missing, description: The backup agent or protected textfile path is unavailable., runbook: OPS-04#backup-protection}
      - alert: TaskBackupFailed
        expr: task_backup_failed{job="task-backup"} == 1 or task_backup_enabled{job="task-backup"} == 0
        for: 1m
        labels: {severity: critical, service: backup, owner: operations}
        annotations: {summary: Task backup protection reports a failure or is disabled, description: RPO is at risk; inspect the protected backup operator journal., runbook: OPS-04#backup-protection}
      - alert: TaskBackupOverdue
        expr: task_backup_last_backup_unixtime_seconds{job="task-backup"} == 0 or time() - task_backup_last_backup_unixtime_seconds{job="task-backup"} > 93600
        for: 5m
        labels: {severity: critical, service: backup, owner: operations}
        annotations: {summary: Task base backup is overdue, description: No successful base backup is recorded within the 26-hour policy., runbook: OPS-04#backup-protection}
      - alert: TaskBackupCheckOverdue
        expr: task_backup_last_check_unixtime_seconds{job="task-backup"} == 0 or time() - task_backup_last_check_unixtime_seconds{job="task-backup"} > 600
        for: 2m
        labels: {severity: critical, service: backup, owner: operations}
        annotations: {summary: Task backup verification is overdue, description: No successful archive or check operation is recorded within ten minutes., runbook: OPS-04#backup-protection}
      - alert: TaskBackupRestoreDrillOverdue
        expr: task_backup_last_restore_test_unixtime_seconds{job="task-backup"} == 0 or time() - task_backup_last_restore_test_unixtime_seconds{job="task-backup"} > 691200
        for: 15m
        labels: {severity: warning, service: backup, owner: operations}
        annotations: {summary: Task restore verification drill is overdue, description: No successful restore verification is recorded within eight days., runbook: OPS-04#backup-protection}
      - alert: TaskBackupCapacityLow
        expr: task_backup_filesystem_size_bytes{job="task-backup"} == 0 or task_backup_filesystem_available_bytes{job="task-backup"} / task_backup_filesystem_size_bytes{job="task-backup"} < 0.15
        for: 15m
        labels: {severity: warning, service: backup, owner: operations}
        annotations: {summary: A Task backup or restore filesystem is low on capacity, description: The location label identifies local off-host or restore workspace capacity., runbook: OPS-04#capacity}
  - name: task-monitoring-self
    rules:
      - alert: TaskMonitoringTargetDown
        expr: up{job=~"prometheus|alertmanager|blackbox-exporter|task-api|task-api-readiness|postgres|task-host|task-worker|task-backup|alert-router"} == 0
        for: 2m
        labels: {severity: critical, service: monitoring, owner: operations}
        annotations: {summary: A Task monitoring target is down, description: Monitoring cannot prove the health of one or more protected targets., runbook: OPS-04#monitoring-self-failure}
      - alert: TaskAlertDeliveryFailure
        expr: increase(task_alert_router_delivery_failures_total[10m]) > 0
        for: 1m
        labels: {severity: critical, service: alerting, owner: operations}
        annotations: {summary: Task alert delivery failed, description: Alertmanager reached the router but the configured customer webhook rejected or timed out., runbook: OPS-04#alert-delivery}
      - alert: TaskAlertRouteNotProduction
        expr: task_alert_router_production_mode == 0
        for: 15m
        labels: {severity: warning, service: alerting, owner: operations}
        annotations: {summary: Task alert routing remains in local test mode, description: Configure the customer owner and webhook secret before production acceptance., runbook: OPS-04#configure-customer-contact}
