global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels: {product: task, environment: production}

rule_files: [/etc/prometheus/alerts.yml]

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
  - job_name: blackbox-exporter
    static_configs:
      - targets: [blackbox-exporter:9115]
  - job_name: task-api
    authorization:
      type: Bearer
      credentials_file: /run/task-secrets/monitoring/metrics-token
    static_configs:
      - targets: [task-api:8080]
  - job_name: task-api-readiness
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: [http://task-api:8080/health/ready]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
  - job_name: task-host
    static_configs:
      - targets: [host-node-exporter:9100]
  - job_name: task-worker
    static_configs:
      - targets: [worker-metrics-exporter:9100]
  - job_name: task-backup
    static_configs:
      - targets: [backup-metrics-exporter:9100]
  - job_name: alert-router
    static_configs:
      - targets: [alert-router:8080]
