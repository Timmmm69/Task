# Local administration remains available through the Unix socket. Every TCP connection must use
# TLS and SCRAM. Network reachability is additionally restricted by the internal Compose network
# and the host firewall described in the SEC-03 runbook.
local   all             all                                     scram-sha-256
hostnossl all           all             0.0.0.0/0               reject
hostnossl all           all             ::/0                    reject
hostssl all             all             0.0.0.0/0               scram-sha-256
hostssl all             all             ::/0                    scram-sha-256
