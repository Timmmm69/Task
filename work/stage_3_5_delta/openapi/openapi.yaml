  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Opaque 8-200 character key. Stored with the SHA-256 request hash.
      schema:
        type: string
        minLength: 8
        maxLength: 200
        pattern: ^[\x21-\x7E]+$
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional replay key for naturally single-use or anonymous operations.
      schema:
        type: string
        minLength: 8
        maxLength: 200
        pattern: ^[\x21-\x7E]+$
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag in the form "v<positive-int64>".
      schema:
        type: string
        maxLength: 64
        pattern: ^"v[1-9][0-9]*"$
    OptionalIfMatch:
      name: If-Match
      in: header
      required: false
      description: Optional strong ETag used only when a target resource already exists.
      schema:
        type: string
        maxLength: 64
        pattern: ^"v[1-9][0-9]*"$
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
        format: uuid
  headers:
    ETag:
      description: Strong current aggregate version.
      schema:
        type: string
        pattern: ^"v[1-9][0-9]*"$
    CorrelationId:
      description: Correlation identifier used in audit and domain events.
