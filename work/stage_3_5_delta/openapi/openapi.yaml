openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Organizer Local Server API
  version: 1.2.0-stage2.3
  license:
    name: Proprietary
    url: https://organizer.company.local/legal/license
  description: 'Normative Stage 2.2 API recovered from the validated Stage 2.1 contract. If-Match guards the aggregate named
    by x-if-match-target. A missing header returns 428, a stale ETag returns 412, and domain or secondary-version conflicts
    return 409. Idempotency-Key is scoped by organization, user and operation; the same key with a different request hash
    returns 409.


    Stage 2.3 closes OQ-001 (organization urgency scale) and OQ-003 (employee global-search results).'
servers:
- url: https://organizer.company.local
