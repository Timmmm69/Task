  /api/v1/search:
    get:
      tags:
      - search
      operationId: GET_api_v1_search
      summary: Глобальный авторизационный поиск
      x-permission: Search.Use
      x-transaction: Read-only cursor snapshot
      x-optimistic-lock: —
      x-idempotency: Safe
      x-side-effects: server-side filters; cursor bound to normalized filters and authorization scope
      x-domain-events: []
      x-required-capability: Search.Use
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: q
        in: query
        required: false
        schema:
          type: string
          minLength: 2
          maxLength: 200
      - name: types
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - task
            - calendar_event
            - project
            - catalog_item
            - file_location
            - contact
            - company
            - interaction
            - comment
            - employee
          minItems: 1
          maxItems: 10
          uniqueItems: true
        description: Canonical object types to search. Other filters are applied only to compatible types without client-side
          post-filtering.
        style: form
        explode: true
      - name: projectIds
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 100
        style: form
        explode: true
      - name: userIds
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 100
        style: form
        explode: true
      - name: departments
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 100
        style: form
        explode: true
      - name: contactIds
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 100
          uniqueItems: true
        description: Return objects linked to at least one supplied contact identifier. Applied by the server before pagination.
        style: form
        explode: true
      - name: hasFiles
        in: query
        required: false
        schema:
          type: boolean
        description: When true, return only objects with at least one accessible file location; when false, only objects without
          accessible files.
      - name: lifecycle
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - active
            - completed
          minItems: 1
          maxItems: 2
          uniqueItems: true
        description: Cross-type lifecycle filter. active excludes completed, archived and trashed objects; completed selects
          terminal business items but still excludes archived and trashed objects.
        style: form
        explode: true
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
          description: RFC 3339 instant. Serialize in UTC with an explicit Z offset; render in the applicable user or object
            time zone.
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
          description: RFC 3339 instant. Serialize in UTC with an explicit Z offset; render in the applicable user or object
            time zone.
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 512
        description: Opaque cursor bound to normalized filters, stable sort, authorization scope version and search-index
          snapshot. Reusing it with different filters is invalid.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 500
        description: Maximum number of authorization-filtered results returned by the server.
      responses:
        '200':
          description: Successful response.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchPage'
        '400':
          description: Malformed request or invalid query syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Authentication failed or token is no longer valid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Authenticated principal lacks the required permission or relationship.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '410':
          description: Sync cursor or retained resource has expired.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Syntactically valid request violates field or domain invariants.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-filters:
      - q
      - types
      - projectIds
      - userIds
      - departments
      - contactIds
      - hasFiles
      - lifecycle
      - from
      - to
      x-pagination:
        style: cursor
        cursorParameter: cursor
        limitParameter: limit
      x-server-side-filtering: true
      x-client-post-filtering: forbidden
      x-cursor-pagination:
        stableSort:
        - relevance desc
        - updatedAt desc
        - type asc
        - id asc
        boundTo:
        - normalized query
        - types
        - projectIds
        - userIds
        - departments
        - contactIds
        - hasFiles
        - lifecycle
        - from
        - to
        - authorization scope version
        - search index snapshot
        - employee visibility policy version
        invalidCursorError: SEARCH_CURSOR_INVALID
        expiredCursorError: SEARCH_CURSOR_EXPIRED
      x-filter-compatibility:
        onIncompatibleType: exclude that type from the server result set before pagination; return 422 only when no requested
          type supports a supplied filter
        contactIds:
        - task
        - calendar_event
        - project
        - catalog_item
        - contact
        - company
        - interaction
        - comment
        hasFiles:
        - task
        - calendar_event
        - project
        - catalog_item
        - contact
        - company
        - interaction
        - comment
        lifecycle:
        - task
        - calendar_event
        - project
        - catalog_item
        - contact
        - company
        - interaction
        - comment
        - employee
        employee:
          allowed:
          - q
          - departments
          - types
          - cursor
          - limit
          forbidden:
          - userIds
          - projectIds
          - contactIds
          - hasFiles
          - from
          - to
          blockedUsers: omit unless User.ReadBlocked; never disclose blocked existence to unauthorized callers
      x-error-codes:
      - AUTHENTICATION_REQUIRED
      - CALENDAR_RANGE_TOO_LARGE
      - DEPENDENCY_CYCLE
      - DEVICE_REVOKED
      - FILE_ACCESS_DENIED
      - FORBIDDEN
      - INVALID_CREDENTIALS
      - MALFORMED_JSON
      - RECURRENCE_RULE_INVALID
      - REFRESH_TOKEN_REUSE
      - SEARCH_CURSOR_EXPIRED
      - SEARCH_CURSOR_INVALID
      - SESSION_EXPIRED
      - SESSION_REVOKED
      - SUBTASK_DEPTH_EXCEEDED
      - SYNC_CURSOR_EXPIRED
      - UNSAFE_FILE_TYPE
      - UNSAFE_PATH
      - VALIDATION_FAILED
      description: Search is authorized and filtered on the server before cursor pagination. type=employee returns the separate
        Employees result group; userIds remains only a related-object filter.
