paths:
  /api/v1/admin/backups:
    get:
      tags:
      - admin
      operationId: GET_api_v1_admin_backups
      summary: Результаты резервного копирования
      x-permission: Backup.Read
      x-transaction: Read-only
      x-optimistic-lock: —
      x-idempotency: Safe
      x-side-effects: —
      x-domain-events: []
      x-required-capability: Backup.Read
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: type
        in: query
        required: false
        schema:
          type: string
          maxLength: 40
      - name: status
        in: query
        required: false
        schema:
          type: string
          maxLength: 40
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
          description: RFC 3339 instant. Serialize in UTC with an explicit Z offset; render in the applicable user or object
            time zone.
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
          description: RFC 3339 instant. Serialize in UTC with an explicit Z offset; render in the applicable user or object
            time zone.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100000
      responses:
        '200':
          description: Successful response.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupRunPage'
        '401':
          description: Authentication failed or token is no longer valid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Authenticated principal lacks the required permission or relationship.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-filters:
      - type
      - status
      - from
      - to
      x-pagination:
        style: page
        pageParameter: page
      x-error-codes:
      - AUTHENTICATION_REQUIRED
      - DEVICE_REVOKED
      - FILE_ACCESS_DENIED
      - FORBIDDEN
      - INVALID_CREDENTIALS
      - REFRESH_TOKEN_REUSE
      - SESSION_EXPIRED
      - SESSION_REVOKED
    post:
      tags:
      - admin
      operationId: POST_api_v1_admin_backups
      summary: Запустить backup
      x-permission: Backup.Execute
      x-transaction: Backup job tx
      x-optimistic-lock: —
      x-idempotency: Idempotency-Key
      x-side-effects: external agent command allowlist
      x-domain-events:
      - BackupRequested
      x-required-capability: Backup.Execute
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Command accepted for asynchronous execution.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            ETag:
              $ref: '#/components/headers/ETag'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupRun'
        '400':
          description: Malformed request or invalid query syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Authentication failed or token is no longer valid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Authenticated principal lacks the required permission or relationship.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Domain conflict, idempotency-key collision, or secondary-version conflict.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Rate limit exceeded.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackupRequest'
      x-error-codes:
      - AUTHENTICATION_REQUIRED
      - DEVICE_REVOKED
      - DUPLICATE_RESOURCE
      - FILE_ACCESS_DENIED
      - FILE_NO_LOCATION
      - FORBIDDEN
      - IDEMPOTENCY_KEY_REUSED
      - INVALID_CREDENTIALS
      - INVALID_STATE_TRANSITION
      - MALFORMED_JSON
      - OBJECT_ARCHIVED
      - OBJECT_DELETED
      - RATE_LIMITED
      - RECURRENCE_OCCURRENCE_EXISTS
      - REFRESH_TOKEN_REUSE
      - SEARCH_CURSOR_INVALID
      - SESSION_EXPIRED
      - SESSION_REVOKED
      - SYNC_SCOPE_CHANGED
      - VERSION_CONFLICT
