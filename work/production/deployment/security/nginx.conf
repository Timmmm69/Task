worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format task_safe '$remote_addr - $request_method $uri $status $body_bytes_sent '
                         'request_id=$request_id duration=$request_time';
    access_log /dev/stdout task_safe;

    limit_req_zone $binary_remote_addr zone=task_per_address:10m rate=20r/s;

    upstream task_api {
        server task-api:8080;
        keepalive 32;
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name _;

        ssl_certificate /run/task-secrets/edge/tls.crt;
        ssl_certificate_key /run/task-secrets/edge/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;

        client_max_body_size 2m;
        client_body_timeout 15s;
        keepalive_timeout 30s;
        send_timeout 30s;

        location / {
            limit_req zone=task_per_address burst=40 nodelay;
            proxy_pass http://task_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_buffering off;
        }
    }
}
