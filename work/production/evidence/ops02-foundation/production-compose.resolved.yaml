name: task-production
services:
  postgres:
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - ssl_cert_file=/run/task-secrets/postgres.crt
      - -c
      - ssl_key_file=/run/task-secrets/postgres.key
      - -c
      - ssl_ca_file=/run/task-secrets/postgres-ca.pem
      - -c
      - hba_file=/etc/postgresql/task-pg_hba.conf
      - -c
      - password_encryption=scram-sha-256
    environment:
      POSTGRES_DB: task
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
      POSTGRES_PASSWORD_FILE: /run/task-secrets/postgres-admin-password
      POSTGRES_USER: postgres
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d $${POSTGRES_DB}
      timeout: 3s
      interval: 5s
      retries: 20
    image: registry.cleanroom.test/postgres@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    networks:
      database: null
    platform: linux/amd64
    restart: unless-stopped
    volumes:
      - type: volume
        source: postgres-data
        target: /var/lib/postgresql/data
        volume: {}
      - type: bind
        source: ./postgresql.pg_hba.conf
        target: /etc/postgresql/task-pg_hba.conf
        read_only: true
        bind: {}
      - type: bind
        source: /var/lib/task/secrets/database/postgres-admin-password
        target: /run/task-secrets/postgres-admin-password
        read_only: true
        bind: {}
      - type: bind
        source: /var/lib/task/secrets/database/postgres.crt
        target: /run/task-secrets/postgres.crt
        read_only: true
        bind: {}
      - type: bind
        source: /var/lib/task/secrets/database/postgres.key
        target: /run/task-secrets/postgres.key
        read_only: true
        bind: {}
      - type: bind
        source: /var/lib/task/secrets/database/postgres-ca.pem
        target: /run/task-secrets/postgres-ca.pem
        read_only: true
        bind: {}
  task-api:
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
        required: true
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__TaskDatabase: Host=postgres;Port=5432;Database=task;Username=task_runtime;Passfile=/run/task-secrets/task-runtime.pgpass;SSL Mode=VerifyFull;Root Certificate=/run/task-secrets/postgres-ca.pem
      Task__Identity__Audience: task-desktop
      Task__Identity__Issuer: https://task.cleanroom.test
      Task__Identity__PepperReference: file:/run/task-secrets/identity/password-pepper
      Task__Identity__SigningKeyReference: file:/run/task-secrets/identity/signing-current.pem
      Task__Identity__VerificationKeysDirectory: file:/run/task-secrets/identity/verification
    image: registry.cleanroom.test/task-api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    init: true
    networks:
      application-edge: null
      database: null
    platform: linux/amd64
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - type: bind
        source: /var/lib/task/secrets/database/task-runtime.pgpass
        target: /run/task-secrets/task-runtime.pgpass
        read_only: true
        bind: {}
      - type: bind
        source: /var/lib/task/secrets/database/postgres-ca.pem
        target: /run/task-secrets/postgres-ca.pem
        read_only: true
        bind: {}
      - type: bind
        source: /var/lib/task/secrets/identity/signing-current.pem
        target: /run/task-secrets/identity/signing-current.pem
        read_only: true
        bind: {}
      - type: bind
        source: /var/lib/task/secrets/identity/password-pepper
        target: /run/task-secrets/identity/password-pepper
        read_only: true
        bind: {}
      - type: bind
        source: /var/lib/task/secrets/identity/verification
        target: /run/task-secrets/identity/verification
        read_only: true
        bind: {}
  task-worker:
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
        required: true
    environment:
      ConnectionStrings__TaskDatabase: Host=postgres;Port=5432;Database=task;Username=task_runtime;Passfile=/run/task-secrets/task-runtime.pgpass;SSL Mode=VerifyFull;Root Certificate=/run/task-secrets/postgres-ca.pem
      DOTNET_ENVIRONMENT: Production
    image: registry.cleanroom.test/task-worker@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    init: true
    networks:
      database: null
    platform: linux/amd64
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - type: bind
        source: /var/lib/task/secrets/database/task-runtime.pgpass
        target: /run/task-secrets/task-runtime.pgpass
        read_only: true
        bind: {}
      - type: bind
        source: /var/lib/task/secrets/database/postgres-ca.pem
        target: /run/task-secrets/postgres-ca.pem
        read_only: true
        bind: {}
  tls-proxy:
    cap_drop:
      - ALL
    depends_on:
      task-api:
        condition: service_started
        required: true
    entrypoint:
      - nginx
      - -g
      - daemon off;
    image: registry.cleanroom.test/nginx-unprivileged@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    init: true
    networks:
      application-edge: null
      frontend: null
    platform: linux/amd64
    ports:
      - mode: ingress
        host_ip: 192.0.2.10
        target: 8443
        published: "443"
        protocol: tcp
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=32m,uid=101,gid=101,mode=0700
    user: 101:101
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind: {}
      - type: bind
        source: /var/lib/task/secrets/edge/tls.crt
        target: /run/task-secrets/edge/tls.crt
        read_only: true
        bind: {}
      - type: bind
        source: /var/lib/task/secrets/edge/tls.key
        target: /run/task-secrets/edge/tls.key
        read_only: true
        bind: {}
networks:
  application-edge:
    name: task-production_application-edge
    ipam:
      config:
        - subnet: 172.30.20.0/24
    internal: true
  database:
    name: task-production_database
    ipam:
      config:
        - subnet: 172.30.10.0/24
    internal: true
  frontend:
    name: task-production_frontend
    ipam:
      config:
        - subnet: 172.30.30.0/24
volumes:
  postgres-data:
    name: task-production_postgres-data
