name: Corporate candidate container validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  production-package:
    name: Production container package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 262ab70094e50cfb7575b1c547649f0615206a55
          persist-credentials: false
      - name: Confirm exact candidate checkout
        shell: bash
        run: |
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "262ab70094e50cfb7575b1c547649f0615206a55"
      - name: Verify production container package
        shell: pwsh
        run: >-
          ./work/production/verification/Test-ContainerPackaging.ps1
          -GitSha 262ab70094e50cfb7575b1c547649f0615206a55
          -ImageScanMapPath "${{ runner.temp }}/task-image-map.json"

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true

      - name: Scan production container vulnerabilities
        shell: pwsh
        run: >-
          ./work/production/verification/Test-ContainerVulnerabilities.ps1
          -ImageMapPath "${{ runner.temp }}/task-image-map.json"
          -EvidenceDirectory "${{ runner.temp }}/task-image-vulnerabilities"

      - name: Build and smoke-test the standalone backup image
        shell: bash
        run: |
          docker build --file work/production/deployment/backup/Dockerfile --tag task-backup-base-check work/production
          docker run --rm --entrypoint dotnet task-backup-base-check --list-runtimes
          docker run --rm --entrypoint pgbackrest task-backup-base-check version
