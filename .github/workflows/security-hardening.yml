name: Security hardening

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-security:
    name: Production dependency and static security
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
    defaults:
      run:
        working-directory: work/production
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Run full production security review
        shell: powershell
        run: >-
          ./verification/Test-IndependentSecurityReview.ps1
          -Configuration Release
          -EvidenceDirectory "${{ runner.temp }}/sec04-review"

      - name: Verify production secrets and TLS contract
        shell: pwsh
        run: ./verification/Test-ProductionSecretsTls.Contract.ps1

  production-image-hardening:
    name: Production image hardening
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify production container package
        shell: pwsh
        run: >-
          ./work/production/verification/Test-ContainerPackaging.ps1
          -GitSha ${{ github.sha }}
          -ImageScanMapPath "${{ runner.temp }}/task-image-map.json"

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true

      - name: Scan production container vulnerabilities
        shell: pwsh
        run: >-
          ./work/production/verification/Test-ContainerVulnerabilities.ps1
          -ImageMapPath "${{ runner.temp }}/task-image-map.json"
          -EvidenceDirectory "${{ runner.temp }}/task-image-vulnerabilities"
