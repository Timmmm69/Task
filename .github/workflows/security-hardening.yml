name: Security hardening

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-security:
    name: Production security and dependencies
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
    defaults:
      run:
        working-directory: work/production
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore and audit production dependencies
        shell: powershell
        run: ./verification/Test-DependencyAudit.ps1

      - name: Run production security gate
        shell: powershell
        run: ./verification/Test-SecurityGate.ps1 -Configuration Release

      - name: Verify production secrets and TLS contract
        shell: pwsh
        run: ./verification/Test-ProductionSecretsTls.Contract.ps1

  production-image-hardening:
    name: Production container hardening
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify production container package
        shell: pwsh
        run: ./work/production/verification/Test-ContainerPackaging.ps1 -GitSha ${{ github.sha }}
